[package]
name = "qubit-codec-misc"
version = "0.4.1"
edition = "2024"
rust-version = "1.94"
autotests = false
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-codec-misc"
description = "Miscellaneous byte and text format codecs for Rust applications"
homepage = "https://github.com/qubit-ltd/rs-codec-misc"
documentation = "https://docs.rs/qubit-codec-misc"
readme = "README.md"
keywords = ["codec", "hex", "base64", "percent", "qubit"]
categories = ["encoding", "parser-implementations"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/tests/**",
    "/benches/**",
]

[dependencies]
base64 = "0.23"
percent-encoding = "2.3"
qubit-utils = "0.2"
qubit-codec = "0.12"
thiserror = "2.0"

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
form_urlencoded = "1.2"

[[bench]]
name = "codec_benchmarks"
harness = false

[[test]]
name = "tests"
path = "tests/mod.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
